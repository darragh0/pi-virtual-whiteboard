[project]
name = "pi-virtual-whiteboard"
version = "0.1.0"
description = "Virtual whiteboard driven by real-time hand tracking on a Raspberry Pi 4 5MP camera"
readme = "README.md"
authors = [{ name = "darragh0" }, { name = "jjola00" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "ai-edge-litert>=2.4.0",
  "numpy>=2.5.5",
  "opencv-python-headless>=5.1.0.95",
]

[project.scripts]
pi-virtual-whiteboard = "pi_virtual_whiteboard.app:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "recommended"
venvPath = "."
venv = ".venv"
ignore = ["reference"]
# numpy's stubs type element access and unpacking as Any, which would flag most array code
reportAny = false
# picamera2/libcamera are typed by local stubs but only installed on the Pi
reportMissingModuleSource = false
# Ignoring a call's return value is routine here (e.g. cv2's drawing functions return the image)
reportUnusedCallResult = false

[dependency-groups]
dev = ["basedpyright>=1.40.2", "ruff>=0.17.6"]
