<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Whiteboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main id="board" data-view="dim">
      <img id="video" alt="Camera" />
      <canvas id="ink"></canvas>
      <canvas id="cursor"></canvas>

      <p id="toast" role="status"></p>
    </main>

    <footer>
      <ul id="gestures">
        <li data-gesture="draw"><b>🤏</b> Pinch to draw</li>
        <li data-gesture="erase"><b>🖐️</b> Open palm to erase</li>
        <li data-gesture="none">Anything else moves</li>
      </ul>
      <div id="colours"></div>
      <p id="keys">
        <kbd>1</kbd>-<kbd>7</kbd> colour <kbd>Z</kbd> undo <kbd>Y</kbd> redo <kbd>S</kbd> save <kbd>V</kbd> view
        <span id="stats">connecting...</span>
      </p>
    </footer>
  </body>
</html>
