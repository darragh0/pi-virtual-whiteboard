[project]
name = "virtual-whiteboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "darragh0", email = "156817523+darragh0@users.noreply.github.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ai-edge-litert>=2.4.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
]

[project.scripts]
virtual-whiteboard = "virtual_whiteboard:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
ignore = ["reference"]
# numpy's stubs type element access and unpacking as Any, which would flag most array code
reportAny = false
# picamera2/libcamera are typed by local stubs but only installed on the Pi
reportMissingModuleSource = false
